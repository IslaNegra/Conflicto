<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Conflicto en madera</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: pantalla de juego de una columna — marcador de turno arriba, tablero 3D en medio, aviso y botón de pasar abajo */
:root{
  --bg-top:#FBE9D0;
  --bg-bottom:#E6BE92;
  --ink:#4A3426;
  --ink-soft:#8C6A52;
  --p1:#2F5FB0;
  --p1-side:#1F3F7A;
  --p2:#B9772A;
  --p2-side:#7E4F17;
  --panel:#FFF8EE;
  --focus:#C9472F;
  --font-display:"Fredoka", ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{margin:0;background:#3b2a1e;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:var(--font-display);color:var(--ink)}
#movil{
  width:min(393px,100vw);height:min(873px,100%);position:relative;overflow:hidden;border-radius:28px;
  background-color:var(--bg-top);background-image:radial-gradient(120% 80% at 50% 35%,var(--bg-top),var(--bg-bottom));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px 14px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:6px;
}
@media (max-width:420px){#movil{border-radius:0;width:100vw;height:100%}}
#aMenu{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px));z-index:3;font-family:var(--font-display);font-size:.95rem;font-weight:700;color:var(--ink);background:var(--panel);border:0;border-radius:12px;padding:.35em .8em;box-shadow:0 4px 0 #C9A985;cursor:pointer}
#aMenu:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A985}
#salir[hidden]{display:none}
#salir{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:rgba(60,35,15,.4);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#salir .card{background:var(--panel);border-radius:22px;padding:1.2em 1.4em;width:100%;max-width:300px;box-shadow:0 10px 0 rgba(0,0,0,.15);text-align:center}
#salir p{margin:0 0 1em;font-size:1.3rem;font-weight:700}#salir p span{font-size:1rem;font-weight:500;color:var(--ink-soft)}
#salir .fila{display:flex;gap:12px}
#salir button{flex:1;font-family:var(--font-display);font-size:1.15rem;font-weight:700;color:#fff;background:var(--focus);border:0;border-radius:14px;padding:.5em;box-shadow:0 5px 0 #8E2F1F;cursor:pointer}
#salir button.sec{background:#9A7660;box-shadow:0 5px 0 #6B4F3E}
#turno{font-size:1.25rem;font-weight:700;padding:.25em 1em;border-radius:999px;color:#fff;background:var(--p1);box-shadow:0 4px 0 var(--p1-side);transition:background .4s,box-shadow .4s}
#turno.p2{background:var(--p2);box-shadow:0 4px 0 var(--p2-side)}
#stage{width:100%;max-width:620px;flex:1;min-height:0;position:relative;touch-action:none}
#stage canvas{display:block;width:100%!important;height:100%!important}
#msg{font-size:1.15rem;font-weight:600;min-height:1.3em;text-align:center;text-wrap:balance}
#pasar{
  font-family:var(--font-display);font-size:1.15rem;font-weight:700;color:#fff;
  background:var(--p1);border:0;border-radius:18px;padding:.5em 1.8em;
  box-shadow:0 6px 0 var(--p1-side);cursor:pointer;transition:transform .08s,box-shadow .08s,opacity .2s;
}
#pasar.p2{background:var(--p2);box-shadow:0 6px 0 var(--p2-side)}
#pasar:active{transform:translateY(4px);box-shadow:0 2px 0 var(--p1-side)}
#pasar:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
#fin[hidden]{display:none}
#fin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(60,35,15,.45);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#fin .card{background:var(--panel);border-radius:22px;padding:1.2em 1.4em;max-width:420px;width:100%;box-shadow:0 10px 0 rgba(0,0,0,.15)}
#fin h2{margin:0 0 .5em;text-align:center;font-size:1.6rem}
#fin table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:1rem}
#fin td,#fin th{padding:.25em .3em;text-align:right}
#fin td:first-child,#fin th:first-child{text-align:left}
#fin tr.total td{font-weight:700;border-top:2px solid var(--ink-soft);font-size:1.15rem}
#fin .p1c{color:var(--p1)}#fin .p2c{color:var(--p2)}
#fin button{display:block;margin:1em auto 0;font-family:var(--font-display);font-size:1.1rem;font-weight:700;color:#fff;background:var(--p1);border:0;border-radius:16px;padding:.5em 1.6em;box-shadow:0 6px 0 var(--p1-side);cursor:pointer}
#err{color:var(--focus);font-weight:600;text-align:center}
#menu[hidden]{display:none}
#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(60,35,15,.35);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#menu .card{background:var(--panel);border-radius:22px;padding:1.4em 1.4em 1.1em;width:100%;max-width:320px;box-shadow:0 10px 0 rgba(0,0,0,.15);display:flex;flex-direction:column;gap:14px}
#menu h2{margin:0 0 .2em;text-align:center;font-size:2rem;letter-spacing:.02em}
#menu button{font-family:var(--font-display);font-size:1.2rem;font-weight:700;color:#fff;background:var(--p1);border:0;border-radius:16px;padding:.6em 1em;box-shadow:0 6px 0 var(--p1-side);cursor:pointer}
#menu #mSolo{background:var(--p2);box-shadow:0 6px 0 var(--p2-side)}
#menu #mOnline{background:#3E8E5A;box-shadow:0 6px 0 #275C3A}
#sala[hidden]{display:none}
#sala{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(60,35,15,.35);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#sala .card{background:var(--panel);border-radius:22px;padding:1.4em 1.4em 1.1em;width:100%;max-width:320px;box-shadow:0 10px 0 rgba(0,0,0,.15);display:flex;flex-direction:column;gap:14px}
#sala h2{margin:0;text-align:center;font-size:1.8rem}
#sala button{font-family:var(--font-display);font-size:1.15rem;font-weight:700;color:#fff;background:#3E8E5A;border:0;border-radius:16px;padding:.55em 1em;box-shadow:0 6px 0 #275C3A;cursor:pointer}
#sala button.sec{background:#9A7660;box-shadow:0 6px 0 #6B4F3E}
#sala .unir{display:flex;gap:8px}
#sala input{flex:1;min-width:0;font-family:var(--font-display);font-size:1.3rem;font-weight:700;letter-spacing:.2em;text-align:center;text-transform:uppercase;border:2px solid #C9A985;border-radius:14px;padding:.35em;background:#fff;color:var(--ink)}
#salaEstado{margin:0;text-align:center;font-weight:600;min-height:1.3em;text-wrap:balance}
#salaEstado b{font-size:2rem;letter-spacing:.15em;display:block;color:#3E8E5A}
#menu .pronto{margin:.2em 0 0;text-align:center;color:var(--ink-soft);font-size:.95rem}
</style>
</head>
<body>

<div id="movil">
<button type="button" id="aMenu" aria-label="Volver al menú">Menú</button>
<div id="turno" aria-live="polite">Jugador 1</div>
<div id="salir" hidden><div class="card"><p>¿Volver al menú?<br><span>Se pierde esta partida.</span></p><div class="fila"><button type="button" id="salirSi">Sí</button><button type="button" id="salirNo" class="sec">No</button></div></div></div>
<div id="stage" aria-label="Tablero de juego en 3D"></div>
<div id="msg" aria-live="polite">Toca tu montón</div>
<button id="pasar" type="button" disabled>Pasar turno</button>
<div id="menu"><div class="card"><h2>Conflicto</h2>
<button type="button" id="mDos">Dos jugadores</button>
<button type="button" id="mSolo">Solitario</button>
<button type="button" id="mOnline">Online</button>
<p class="pronto">Contra la máquina: muy pronto</p></div></div>
<div id="sala" hidden><div class="card"><h2>Online</h2>
<button type="button" id="crearSala">Crear sala</button>
<div class="unir"><input id="codSala" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="CÓDIGO" aria-label="Código de la sala"><button type="button" id="unirSala">Unirme</button></div>
<p id="salaEstado" aria-live="polite"></p>
<button type="button" id="salaVolver" class="sec">Volver</button></div></div>
<div id="fin" hidden><div class="card"><h2 id="finTit">Recuento</h2><table id="finTab"></table><button id="otraPartida" type="button">Volver al menú</button></div></div>
<p id="err" hidden></p>
</div>

const renderer=new T3.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.outputEncoding=T3.sRGBEncoding;
renderer.toneMapping=T3.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T3.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene=new T3.Scene();
const camera=new T3.PerspectiveCamera(36,1,.1,100);
(function env(){
  const pm=new T3.PMREMGenerator(renderer);const s=new T3.Scene();
  s.add(new T3.Mesh(new T3.BoxGeometry(30,30,30),new T3.MeshBasicMaterial({color:0x2a2018,side:T3.BackSide})));
  const pan=(w,h,x,y,z,c)=>{const m=new T3.Mesh(new T3.PlaneGeometry(w,h),new T3.MeshBasicMaterial({color:c,side:T3.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);s.add(m);};
  pan(10,5,-4,13,4,0xffffff);pan(10,5,4,13,-4,0xffffff);pan(5,5,10,8,-6,0xbfae9a);pan(5,5,-10,8,6,0xbfae9a);
  scene.environment=pm.fromScene(s,.03).texture;
})();
scene.add(new T3.HemisphereLight(0xfff4e6,0x6b4a30,.35));
const sun=new T3.DirectionalLight(0xfff0dc,1.6);
sun.position.set(-4,9,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-7,right:7,top:7,bottom:-7,near:1,far:25});
sun.shadow.radius=4;sun.shadow.bias=-.0006;scene.add(sun);
const catcher=new T3.Mesh(new T3.PlaneGeometry(40,40),new T3.ShadowMaterial({opacity:.22}));
catcher.rotation.x=-Math.PI/2;catcher.position.y=-.36;catcher.receiveShadow=true;scene.add(catcher);

function rrShape(w,r){const s=new T3.Shape(),x=-w/2,y=-w/2;
  s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+w-r);s.quadraticCurveTo(x+w,y+w,x+w-r,y+w);
  s.lineTo(x+r,y+w);s.quadraticCurveTo(x,y+w,x,y+w-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s;}
function slab(w,h,r,bev){
  const g=new T3.ExtrudeGeometry(rrShape(w,r),{depth:Math.max(.001,h-2*bev),bevelEnabled:true,bevelThickness:bev,bevelSize:bev,bevelSegments:5,curveSegments:10});
  const pos=g.attributes.position,uv=g.attributes.uv,gr=g.groups[0],W=w+2*bev;
  for(let i=gr.start;i<gr.start+gr.count;i++){uv.setXY(i,(pos.getX(i)+W/2)/W,(pos.getY(i)+W/2)/W);}
  uv.needsUpdate=true;g.rotateX(-Math.PI/2);g.translate(0,bev,0);g.computeVertexNormals();return g;}
const loader=new T3.TextureLoader();
function tex(src,cb){const t=loader.load(src,cb);t.encoding=T3.sRGBEncoding;t.anisotropy=8;return t;}

// ---------- tablero ----------
const texB=tex(TABLERO);
const sideB=new T3.MeshStandardMaterial({color:0x3E2416,roughness:.5});sideB.color.convertSRGBToLinear();
const tray=new T3.Mesh(slab(1024/180-.12,.36,.06,.06),[new T3.MeshPhysicalMaterial({map:texB,roughness:.5,clearcoat:.5,clearcoatRoughness:.25}),sideB]);
tray.position.y=-.36;tray.receiveShadow=true;tray.castShadow=true;scene.add(tray);
const cellPos=(r,c)=>new T3.Vector3(c-2,0,r-2);

const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  x.shadowColor='#fff';x.shadowBlur=22;x.strokeStyle='rgba(255,255,255,.95)';x.lineWidth=7;
  const r=18,a=22,b=128-22;x.beginPath();x.moveTo(a+r,a);x.arcTo(b,a,b,b,r);x.arcTo(b,b,a,b,r);x.arcTo(a,b,a,a,r);x.arcTo(a,a,b,a,r);x.closePath();x.stroke();
  x.fillStyle='rgba(255,255,255,.28)';x.fill();return new T3.CanvasTexture(c);})();
const glowPool=[];
function glowAt(i,pos,color){let g=glowPool[i];
  if(!g){g=new T3.Mesh(new T3.PlaneGeometry(1.06,1.06),new T3.MeshBasicMaterial({map:glowTex,transparent:true,blending:T3.AdditiveBlending,depthWrite:false,toneMapped:false,opacity:0}));
    g.rotation.x=-Math.PI/2;scene.add(g);glowPool[i]=g;}
  g.material.color.set(color);g.position.copy(pos);g.visible=true;g.userData.on=true;return g;}
function glowsOff(){glowPool.forEach(g=>{g.userData.on=false;g.userData.dest=null;});}

// casillas invisibles para tocar
const pickCells=[];
const pickG=new T3.PlaneGeometry(1,1);pickG.rotateX(-Math.PI/2);
const pickM=new T3.MeshBasicMaterial({visible:false});
for(let r=0;r<5;r++)for(let c=0;c<5;c++){const m=new T3.Mesh(pickG,pickM);m.position.copy(cellPos(r,c));m.position.y=.002;m.userData={cell:[r,c]};scene.add(m);pickCells.push(m);}

// ---------- fichas ----------
const clones=[];
const caras=tex(CARAS,()=>clones.forEach(t=>{t.image=caras.image;t.needsUpdate=true;}));
const texCanto=tex(CANTO);texCanto.wrapS=T3.RepeatWrapping;texCanto.repeat.set(1/.8,1/.1);texCanto.offset.set(.5,0);
const matCanto=new T3.MeshPhysicalMaterial({map:texCanto,roughness:.45,clearcoat:.5,clearcoatRoughness:.25});matCanto.color.setScalar(1.7);
const matDebajo=new T3.MeshStandardMaterial({map:tex(LISA),roughness:.6,polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-4});
const caraMat={};
function matCara(ci,si){const k=ci+'_'+si;if(caraMat[k])return caraMat[k];
  const t=caras.clone();clones.push(t);if(caras.image)t.needsUpdate=true;t.repeat.set(.2,.2);t.offset.set(si*.2,1-(ci+1)*.2);
  return caraMat[k]=new T3.MeshPhysicalMaterial({map:t,roughness:.4,clearcoat:.6,clearcoatRoughness:.2});}
const gFicha=slab(.8,.1,.18,.008);
const gDebajo=(()=>{const g=new T3.ShapeGeometry(rrShape(.8,.18));const uv=g.attributes.uv,p=g.attributes.position;
  for(let i=0;i<p.count;i++)uv.setXY(i,p.getX(i)/.8+.5,p.getY(i)/.8+.5);g.rotateX(Math.PI/2);return g;})();
const H=.1; // grosor
function makeTileObj(ci,si,id){
  const grp=new T3.Group();
  const body=new T3.Mesh(gFicha,[matCara(ci,si),matCanto]);body.castShadow=true;body.receiveShadow=true;body.position.y=-.05;body.userData.tile=id;grp.add(body);
  const bot=new T3.Mesh(gDebajo,matDebajo);bot.position.y=-.053;bot.userData.tile=id;grp.add(bot);
  scene.add(grp);return grp;}

const PILE=[new T3.Vector3(2.0,-.36,3.75),new T3.Vector3(-2.0,-.36,-3.75)];

const FALL=[new T3.Vector3(-1.25,-.36,3.75),new T3.Vector3(1.25,-.36,-3.75)];
const pileObjs=[[],[]];
function labelSprite(){const c=document.createElement('canvas');c.width=128;c.height=64;const t=new T3.CanvasTexture(c);
  const s=new T3.Sprite(new T3.SpriteMaterial({map:t,depthTest:false,toneMapped:false}));s.scale.set(.6,.3,1);s.renderOrder=5;
  s.userData.set=(txt,col)=>{const x=c.getContext('2d');x.clearRect(0,0,128,64);x.fillStyle='rgba(74,52,38,.82)';
    x.beginPath();x.moveTo(20,6);x.arcTo(122,6,122,58,24);x.arcTo(122,58,6,58,24);x.arcTo(6,58,6,6,24);x.arcTo(6,6,122,6,24);x.fill();
    x.fillStyle=col||'#fff';x.font='700 36px Fredoka, Trebuchet MS, sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(txt,64,34);t.needsUpdate=true;};
  scene.add(s);return s;}
const pileLbl=[labelSprite(),labelSprite()],collLbl=[labelSprite(),labelSprite()],fallLbl=[labelSprite(),labelSprite()];
function updatePileVis(p){const n=ST.piles[p].length;const want=Math.min(n,4);
  while(pileObjs[p].length<want){const o=makeTileObj(0,0,-1);o.rotation.x=Math.PI;pileObjs[p].push(o);}
  while(pileObjs[p].length>want){const o=pileObjs[p].pop();scene.remove(o);}
  pileObjs[p].forEach((o,i)=>{o.position.set(PILE[p].x,PILE[p].y+.05+i*H,PILE[p].z);o.rotation.y=(i%2?.05:-.04)+(p?Math.PI:0);o.children.forEach(m=>m.userData.pile=p);});
  pileLbl[p].visible=!(ST.modo==='solo'&&p===1);pileLbl[p].position.set(PILE[p].x,PILE[p].y+.05+want*H+.35,PILE[p].z);pileLbl[p].userData.set(String(n));
  collLbl[p].visible=ST.coll[p].length>0;collLbl[p].position.set(COLL[p].x,COLL[p].y+.05+Math.min(ST.coll[p].length,6)*H+.3,COLL[p].z);collLbl[p].userData.set('★ '+ST.coll[p].length,'#FFE08A');
  fallLbl[p].visible=ST.fall[p].length>0;fallLbl[p].position.set(FALL[p].x,FALL[p].y+.05+Math.min(ST.fall[p].length,6)*H+.3,FALL[p].z);fallLbl[p].userData.set('✕ '+ST.fall[p].length,'#FFB4A0');
}

const softTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.45,'rgba(255,255,255,.45)');g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,64,64);return new T3.CanvasTexture(c);})();
let parts=[];
function spawn(o){const s=new T3.Sprite(new T3.SpriteMaterial({map:softTex,color:o.color||0xfff6e8,transparent:true,depthWrite:false,blending:o.add?T3.AdditiveBlending:T3.NormalBlending,toneMapped:!o.add}));
  s.position.copy(o.p);s.userData=Object.assign({v:new T3.Vector3(),g:0,drag:4,life:0,max:.7,size:.25,grow:1.8,op:.85},o);scene.add(s);parts.push(s);}
function dust(p,n,str){for(let i=0;i<n;i++){const a=i/n*Math.PI*2+Math.random()*.4,sp=(1.2+Math.random())*str;
  spawn({p:new T3.Vector3(p.x+Math.cos(a)*.38,p.y+.02,p.z+Math.sin(a)*.38),v:new T3.Vector3(Math.cos(a)*sp,.35+Math.random()*.35,Math.sin(a)*sp),max:.5+Math.random()*.35,size:.2+Math.random()*.1});}}
function sparkle(p,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,e=Math.random()*1.2,sp=1.5+Math.random()*2.5;
  spawn({p:p.clone(),v:new T3.Vector3(Math.cos(a)*Math.cos(e)*sp,Math.sin(e)*sp+1,Math.sin(a)*Math.cos(e)*sp),g:-5,drag:1.5,add:true,color:[0xFFD566,0xFFF2B0,0xFFB347][i%3],size:.12,grow:-.6,max:.6+Math.random()*.5,op:1});}}
function updParts(dt){parts=parts.filter(s=>{const u=s.userData;u.life+=dt;const k=Math.exp(-u.drag*dt);u.v.multiplyScalar(k);u.v.y+=u.g*dt;
  s.position.addScaledVector(u.v,dt);const t=u.life/u.max;s.material.opacity=u.op*Math.pow(Math.max(0,1-t),1.4);const sc=Math.max(.01,u.size*(1+t*u.grow));s.scale.set(sc,sc,sc);
  if(t>=1){scene.remove(s);s.material.dispose();return false;}return true;});}
// número flotante (−1)
function floatText(txt,p,color){const c=document.createElement('canvas');c.width=256;c.height=128;const x=c.getContext('2d');
  x.font='700 92px Fredoka, Trebuchet MS, sans-serif';x.textAlign='center';x.textBaseline='middle';x.lineWidth=14;x.strokeStyle='rgba(60,25,10,.85)';x.strokeText(txt,128,66);x.fillStyle=color;x.fillText(txt,128,66);
  const s=new T3.Sprite(new T3.SpriteMaterial({map:new T3.CanvasTexture(c),transparent:true,depthTest:false,toneMapped:false}));s.renderOrder=9;s.position.copy(p);scene.add(s);
  tw(1.3,u=>{s.position.y=p.y+u*.9;const sc=.5+.6*elastic(Math.min(1,u*2.2));s.scale.set(sc*1.6,sc*.8,1);s.material.opacity=u<.7?1:1-(u-.7)/.3;}).then(()=>scene.remove(s));
  for(let i=0;i<14;i++){const a=Math.random()*Math.PI*2;spawn({p:p.clone(),v:new T3.Vector3(Math.cos(a)*1.6,1+Math.random(),Math.sin(a)*1.6),g:-4,drag:2,add:true,color:0xFF6B4A,size:.1,grow:-.5,max:.5});}}

// ---------- animaciones ----------
const lerp=(a,b,t)=>a+(b-a)*t,eIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,eOut=t=>1-Math.pow(1-t,3),eIn=t=>t*t*t;
const eBack=t=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const elastic=t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*Math.PI)/3)+1;
let anims=[];
function tw(dur,fn){return new Promise(res=>{anims.push({t:0,dur:Math.max(.001,dur),fn,res});});}
function squash(o,amt){const s0=performance.now();tw(.55,u=>{const q=Math.exp(-5.5*u)*Math.cos(u*16);o.scale.set(1+amt*.6*q,1-amt*q,1+amt*.6*q);}).then(()=>o.scale.set(1,1,1));}
let shake=0;

async function fly(o,to,{h=1,dur=.6,rx0=o.rotation.x,rx1=0,ry1=o.rotation.y,land=true,str=1}={}){
  const from=o.position.clone(),ry0=o.rotation.y;
  await tw(dur,u=>{const e=eIO(u);o.position.set(lerp(from.x,to.x,e),lerp(from.y,to.y,e)+Math.sin(Math.PI*u)*h,lerp(from.z,to.z,e));
    o.rotation.x=lerp(rx0,rx1,e);o.rotation.y=lerp(ry0,ry1,e);o.rotation.z=Math.sin(u*Math.PI*2)*.1*h;});
  o.rotation.z=0;
  if(land){squash(o,.28*str);dust(new T3.Vector3(to.x,to.y-.05,to.z),14,.9*str);shake=.05*str;}
}
async function slide(o,to,lean){
  const from=o.position.clone(),y0=from.y,lift=.4;
  await tw(.16,u=>{o.position.y=y0+(Math.max(y0,to.y)+lift-y0)*eOut(u);});
  const yTop=o.position.y;
  await tw(.42,u=>{const e=eBack(u);o.position.x=lerp(from.x,to.x,e);o.position.z=lerp(from.z,to.z,e);o.position.y=lerp(yTop,to.y,eIn(u));
    o.rotation.x=lean.x*Math.sin(u*Math.PI)*.25;o.rotation.z=lean.z*Math.sin(u*Math.PI)*.25;});
  o.rotation.x=0;o.rotation.z=0;o.position.copy(to);squash(o,.18);dust(new T3.Vector3(to.x,to.y-.05,to.z),10,.6);shake=.03;
}

// ---------- estado ----------
const DIRS=[[[-1,0],[0,-1]],[[1,0],[0,1]]];
const STARTS=[[[4,4],[4,3],[3,4]],[[0,0],[0,1],[1,0]]];
const GOAL=[[0,0],[4,4]];

let ST,tiles;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function nuevaPartida(modo,montones){
  if(tiles)tiles.forEach(t=>t.obj&&scene.remove(t.obj));
  tiles=[];
  ST={modo:modo||'dos',cur:0,phase:'draw',piles:[[],[]],cells:[...Array(5)].map(()=>[...Array(5)].map(()=>[])),coll:[[],[]],fall:[[],[]],pen:[0,0],hand:null,sel:null,busy:false};
  for(let p=0;p<(ST.modo==='solo'?1:2);p++){for(let ci=0;ci<5;ci++)for(let si=0;si<5;si++){const id=tiles.length;tiles.push({id,owner:p,ci,si,obj:null,r:-1,c:-1});ST.piles[p].push(id);}shuffle(ST.piles[p]);}
  if(montones)ST.piles=montones.map(a=>a.slice());
  for(let p=0;p<2;p++)updatePileVis(p);
  camYaw=camYawTarget=(ST.modo==='online'&&RED.asiento===1)?Math.PI:0;glowsOff();ui();
}
const topAt=(r,c)=>{const s=ST.cells[r][c];return s.length?s[s.length-1]:null;};
function tileWorld(r,c,k){const p=cellPos(r,c);p.y=H/2+k*H;return p;}
// conflictos de una ficha: en su fila y en su columna
function conflictosDe(id){const t=tiles[id];const out={fila:false,col:false};if(topAt(t.r,t.c)!==id)return out;
  for(let i=0;i<5;i++){
    if(i!==t.c){const o=topAt(t.r,i);if(o!=null){const u=tiles[o];if(u.ci===t.ci||u.si===t.si)out.fila=true;}}
    if(i!==t.r){const o=topAt(i,t.c);if(o!=null){const u=tiles[o];if(u.ci===t.ci||u.si===t.si)out.col=true;}}}
  return out;}
// se repelen: conflicto en la fila → solo en vertical; en la columna → solo en horizontal; en las dos → las dos
function puedeMover(id,dr,dc){const k=conflictosDe(id);if(!k.fila&&!k.col)return false;
  if(k.fila&&k.col)return true;if(k.fila)return dr!==0;return dc!==0;}
function inConflict(id){const t=tiles[id];if(topAt(t.r,t.c)!==id)return false;
  for(let i=0;i<5;i++){for(const [r,c] of [[t.r,i],[i,t.c]]){if(r===t.r&&c===t.c)continue;const o=topAt(r,c);if(o==null)continue;const u=tiles[o];if(u.ci===t.ci||u.si===t.si)return true;}}return false;}
function anyConflict(){for(let r=0;r<5;r++)for(let c=0;c<5;c++){const id=topAt(r,c);if(id!=null&&inConflict(id))return true;}return false;}

    return;}

    turnoEl.textContent=mio?'Tu turno':'Turno del rival';turnoEl.classList.toggle('p2',p===1);pasarBtn.classList.toggle('p2',RED.asiento===1);pasarBtn.textContent='Pasar turno';

function showStartGlows(){glowsOff();STARTS[ST.cur].forEach(([r,c],i)=>{const p=cellPos(r,c);p.y=.004+ST.cells[r][c].length*H;const g=glowAt(i,p,COL_UI[ST.cur]);g.userData.dest={place:[r,c]};});}

async function robar(){
  const p=ST.cur;if(!ST.piles[p].length)return;
  ST.busy=true;ui();
  const id=ST.piles[p].pop();const t=tiles[id];
  t.obj=makeTileObj(t.ci,t.si,id);t.obj.rotation.x=Math.PI;t.obj.rotation.y=p?Math.PI:0;
  const n=ST.piles[p].length;t.obj.position.set(PILE[p].x,PILE[p].y+.05+Math.min(n,4)*H,PILE[p].z);
  updatePileVis(p);
  const hover=PILE[p].clone();hover.y=1.0;hover.x*=.97;hover.z*=.97;
  await fly(t.obj,hover,{h:.5,dur:.5,rx0:Math.PI,rx1:0,ry1:p?Math.PI:0,land:false});
  ST.hand=id;ST.phase='place';ST.busy=false;showStartGlows();ui();
  bob=t.obj;bobY=hover.y;
}
let bob=null,bobY=0;
async function colocar(r,c){
  const id=ST.hand,t=tiles[id];ST.busy=true;bob=null;glowsOff();ui();
  const k=ST.cells[r][c].length;const to=tileWorld(r,c,k);
  await fly(t.obj,to,{h:.8,dur:.55,rx1:0,ry1:ST.cur?Math.PI:0});
  ST.cells[r][c].push(id);t.r=r;t.c=c;ST.hand=null;ST.phase='move';ST.busy=false;ui();
}
async function seleccionar(id){
  if(ST.sel===id)return soltar();
  if(ST.sel!=null)await soltar(true);
  ST.sel=id;const t=tiles[id];const base=tileWorld(t.r,t.c,ST.cells[t.r][t.c].length-1);
  tw(.15,u=>{t.obj.position.y=base.y+.32*eOut(u);});
  glowsOff();DIRS[ST.cur].forEach(([dr,dc],i)=>{const r=t.r+dr,c=t.c+dc;const p=cellPos(r,c);
    const inside=r>=0&&r<5&&c>=0&&c<5;p.y=.004+(inside?ST.cells[r][c].length*H:0);
    const g=glowAt(i,p,inside?0xFFFFFF:0xFF7A5A);g.userData.dest={move:[r,c]};});

async function soltar(quick){
  const id=ST.sel;if(id==null)return;ST.sel=null;glowsOff();const t=tiles[id];
  const base=tileWorld(t.r,t.c,ST.cells[t.r][t.c].length-1);const y0=t.obj.position.y;
  const pr=tw(quick?.1:.22,u=>{t.obj.position.y=lerp(y0,base.y,eIn(u));});ui();
  if(!quick){await pr;squash(t.obj,.08);}
}
async function mover(r,c){
  const id=ST.sel,t=tiles[id],p=ST.cur;
  if(!puedeMover(id,r-t.r,c-t.c)){await soltar();return;}   // no puede ir ahí: vuelve a bajar, sin más
  ST.busy=true;ST.sel=null;glowsOff();ui();
  const [fr,fc]=[t.r,t.c];ST.cells[fr][fc].pop();
  const inside=r>=0&&r<5&&c>=0&&c<5;const lean={x:(r-fr),z:-(c-fc)};
  if(!inside){ // se sale del tablero
    const edge=cellPos(r,c);edge.y=t.obj.position.y;
    await slide(t.obj,new T3.Vector3(edge.x,.05,edge.z),{x:0,z:0}).catch(()=>{});
    const from=t.obj.position.clone();
    await tw(.75,u=>{t.obj.position.set(from.x+(c-fc)*.9*u,from.y-6*u*u,from.z+(r-fr)*.9*u);t.obj.rotation.x=(r-fr)*3*u;t.obj.rotation.z=-(c-fc)*3*u;const s=1-u*.9;t.obj.scale.set(s,s,s);});
    ST.fall[p].push(id);t.r=t.c=-1;
    const k=Math.min(ST.fall[p].length-1,5);t.obj.rotation.set(Math.PI,p?Math.PI:0,0);
    t.obj.position.set(FALL[p].x,FALL[p].y+.05+k*H,FALL[p].z);
    await tw(.35,u=>{const s=.1+.9*elastic(u);t.obj.scale.set(s,s,s);});t.obj.scale.set(1,1,1);
    updatePileVis(p);
  }else{
    const k=ST.cells[r][c].length;await slide(t.obj,tileWorld(r,c,k),lean);
    ST.cells[r][c].push(id);t.r=r;t.c=c;
    if(r===GOAL[p][0]&&c===GOAL[p][1]){ // llega a la esquina del rival: te la llevas
      ST.cells[r][c].pop();t.r=t.c=-1;sparkle(t.obj.position.clone().add(new T3.Vector3(0,.2,0)),40);
      ST.coll[p].push(id);const kk=Math.min(ST.coll[p].length-1,5);
      await fly(t.obj,new T3.Vector3(COLL[p].x,COLL[p].y+.05+kk*H,COLL[p].z),{h:1.4,dur:.8,rx1:Math.PI,ry1:p?Math.PI:0,str:.6});

    }
  }
  ST.busy=false;ui();
}
async function pasar(){
  if(ST.busy||ST.phase!=='move')return;
  if(ST.sel!=null)await soltar(true);
  if(ST.modo==='solo'){if(ST.piles[0].length)return;if(anyConflict()){senalarConflictos();return;}fin();return;}
  if(anyConflict()){ST.pen[ST.cur]++;floatText('−1',new T3.Vector3(0,.8,0).add(PILE[ST.cur].clone().multiplyScalar(.55)),'#FF6B4A');return;}
  if(!ST.piles[0].length&&!ST.piles[1].length){fin();return;}
  ST.busy=true;ST.phase='turn';ui();
  ST.cur=1-ST.cur;
  if(ST.modo==='online'){await tw(.3,()=>{});}
  else{camYawTarget=ST.cur?Math.PI:0;await tw(1.1,u=>{camYaw=lerp(ST.cur?0:Math.PI,camYawTarget,eIO(u));});}

  <tr><td>Pasar con conflicto ×−1</td><td>${a.pen} → ${a.v[4]}</td><td>${b.pen} → ${b.v[4]}</td></tr>
  <tr class="total"><td>Total</td><td>${tot[0]}</td><td>${tot[1]}</td></tr>`;
  document.getElementById('finTit').textContent=tot[0]===tot[1]?'Empate':(ST.modo==='online'?((tot[0]>tot[1]?0:1)===RED.asiento?'¡Has ganado!':'Gana el rival'):'Gana '+NOMBRES[tot[0]>tot[1]?0:1]);

// ---------- toques ----------
const ray=new T3.Raycaster(),ptr=new T3.Vector2();let down=null;
// girar el tablero arrastrando con el dedo; un toque corto sigue siendo un toque
let giro=null;
stage.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};giro={x:e.clientX,y:e.clientY,yaw:yawOff,pitch:pitch,mov:false};try{stage.setPointerCapture(e.pointerId);}catch(_){}});
stage.addEventListener('pointermove',e=>{if(!giro)return;const dx=e.clientX-giro.x,dy=e.clientY-giro.y;
  if(!giro.mov&&Math.hypot(dx,dy)>12)giro.mov=true;
  if(giro.mov){yawOff=giro.yaw-dx*.009;pitch=Math.min(1.45,Math.max(.4,giro.pitch+dy*.006));}});
const finGiro=()=>{giro=null;};
stage.addEventListener('pointerup',e=>{const g=giro;finGiro();if(!down)return;down=null;if(g&&g.mov)return;tap(e.clientX,e.clientY);});
stage.addEventListener('pointercancel',()=>{finGiro();down=null;});
function hits(x,y,objs){const r=renderer.domElement.getBoundingClientRect();ptr.set((x-r.left)/r.width*2-1,-(y-r.top)/r.height*2+1);ray.setFromCamera(ptr,camera);return ray.intersectObjects(objs,true);}
function tap(x,y){
  if(ST.busy)return;
  if(ST.modo==='online'&&ST.cur!==RED.asiento)return;
  const p=ST.cur;
  if(ST.phase==='draw'){const h=hits(x,y,pileObjs[p]);if(h.length)act('robar');return;}
  if(ST.modo==='solo'&&ST.phase==='move'&&ST.sel==null&&hits(x,y,pileObjs[0]).length){if(!anyConflict())robar();else senalarConflictos();return;}
  const glows=glowPool.filter(g=>g&&g.userData.on);
  const hg=hits(x,y,glows);
  if(ST.phase==='place'){
    let target=hg.length?hg[0].object.userData.dest.place:null;
    if(!target){const hc=hits(x,y,pickCells.concat(tiles.filter(t=>t.r>=0).map(t=>t.obj)));
      for(const h of hc){let rc=h.object.userData.cell;if(!rc&&h.object.userData.tile!=null){const t=tiles[h.object.userData.tile];rc=[t.r,t.c];}
        if(rc&&STARTS[p].some(([a,b])=>a===rc[0]&&b===rc[1])){target=rc;break;}}}
    if(target)act('colocar',target[0],target[1]);return;}
  if(ST.phase==='move'){
    if(ST.sel!=null&&hg.length){const [r,c]=hg[0].object.userData.dest.move;act('mover',r,c);return;}
    const tops=[];for(let r=0;r<5;r++)for(let c=0;c<5;c++){const id=topAt(r,c);if(id!=null)tops.push(tiles[id].obj);}
    const ht=hits(x,y,tops);
    if(ht.length){const id=ht[0].object.userData.tile;act('seleccionar',id);return;}
    if(ST.sel!=null)act('soltar');
  }
}


// ---------- solitario: señalar las fichas en conflicto ----------
let marcas=[];
function senalarConflictos(){
  marcas.forEach(m=>scene.remove(m));marcas=[];
  const ids=[];for(let r=0;r<5;r++)for(let c=0;c<5;c++){const id=topAt(r,c);if(id!=null&&inConflict(id))ids.push(id);}
  ids.forEach(id=>{const t=tiles[id];const p=tileWorld(t.r,t.c,ST.cells[t.r][t.c].length-1);
    const m=new T3.Mesh(new T3.PlaneGeometry(1.15,1.15),new T3.MeshBasicMaterial({map:glowTex,color:0xFF2A14,transparent:true,depthWrite:false,toneMapped:false,opacity:0}));
    m.rotation.x=-Math.PI/2;m.position.set(p.x,p.y+H/2+.01,p.z);m.renderOrder=4;scene.add(m);marcas.push(m);
    for(let i=0;i<10;i++){const a=i/10*Math.PI*2;spawn({p:new T3.Vector3(p.x+Math.cos(a)*.42,p.y+.08,p.z+Math.sin(a)*.42),v:new T3.Vector3(Math.cos(a)*.6,1.2+Math.random(),Math.sin(a)*.6),g:-3,drag:2,add:true,color:[0xFF6B4A,0xFFB347][i%2],size:.1,grow:-.5,max:.6+Math.random()*.3});}
    const o=t.obj,x0=p.x;tw(.5,u=>{o.position.x=x0+Math.sin(u*Math.PI*6)*.04*(1-u);}).then(()=>{o.position.x=x0;});});
  const mine=marcas.slice();
  tw(2.4,u=>{const v=(.55+.45*Math.sin(u*Math.PI*6-Math.PI/2))*(u<.85?1:(1-u)/.15);mine.forEach(m=>m.material.opacity=v);}).then(()=>{mine.forEach(m=>scene.remove(m));marcas=marcas.filter(m=>!mine.includes(m));});
}

// ---------- acciones (iguales en local y online) ----------
const ACC={robar:()=>robar(),colocar:(r,c)=>colocar(r,c),seleccionar:id=>seleccionar(id),soltar:()=>soltar(),mover:(r,c)=>mover(r,c),pasar:()=>pasar()};
function act(a,...args){
  if(ST.modo==='online'){if(ST.cur!==RED.asiento)return;RED.tubo&&RED.tubo.enviar({t:'acc',a,args,n:++RED.nAcc});}
  return ACC[a](...args);}
let colaRemota=Promise.resolve();
function accionRemota(m){colaRemota=colaRemota.then(async()=>{for(let i=0;i<500&&ST.busy;i++)await tw(.02,()=>{});await ACC[m.a](...(m.args||[]));}).catch(()=>{});}

// ---------- online: buzones públicos (como Isla Negra) ----------
const BUZONES=["wss://broker.emqx.io:8084/mqtt","wss://test.mosquitto.org:8081/mqtt","wss://broker.hivemq.com:8884/mqtt"];
const BIBLIOTECA=["https://cdn.jsdelivr.net/npm/mqtt@5.15.2/dist/mqtt.min.js","https://unpkg.com/mqtt@5.15.2/dist/mqtt.min.js"];
const RED={yo:Math.random().toString(36).slice(2,10),asiento:0,tubo:null,vistos:new Set(),enviados:0,nAcc:0,caido:false,empezada:false};
const salaEl=document.getElementById('sala'),salaEst=document.getElementById('salaEstado');
let cargaLib=null;
function cargarLib(){if(window.mqtt)return Promise.resolve();if(cargaLib)return cargaLib;
  cargaLib=new Promise((bien,mal)=>{let k=0;const intenta=()=>{if(k>=BIBLIOTECA.length){cargaLib=null;mal();return;}
    const sc=document.createElement('script');sc.src=BIBLIOTECA[k++];sc.async=true;sc.onload=()=>window.mqtt?bien():intenta();sc.onerror=()=>{sc.remove();intenta();};document.head.appendChild(sc);};intenta();});
  return cargaLib;}
function tubo(cod,alRecibir,alConectar){
  const tema='conflicto/sala/'+cod;const clientes=[];let vivo=true,avisado=false;
  const publicar=m=>{const txt=JSON.stringify(m);clientes.forEach(c=>{if(c.connected)try{c.publish(tema,txt);}catch(e){}});};
  BUZONES.forEach((donde,i)=>{const c=window.mqtt.connect(donde,{clientId:'conf_'+RED.yo+'_'+i,clean:true,connectTimeout:8000,reconnectPeriod:3000,keepalive:30,
      will:{topic:tema,qos:0,retain:false,payload:JSON.stringify({t:'adios',de:RED.yo,id:RED.yo+':adios'})}});
    clientes.push(c);
    c.on('connect',()=>{c.subscribe(tema,{qos:0},err=>{if(!err&&!avisado){avisado=true;alConectar();}});});
    c.on('message',(t,carga)=>{try{const m=JSON.parse(carga.toString());if(!m||m.de===RED.yo||RED.vistos.has(m.id))return;RED.vistos.add(m.id);alRecibir(m);}catch(e){}});
    c.on('error',()=>{});});
  return {enviar(m){m.de=RED.yo;m.id=RED.yo+':'+(++RED.enviados);publicar(m);},cerrar(){vivo=false;clientes.forEach(c=>{try{c.end(true);}catch(e){}});}};}
function cerrarRed(){if(RED.tubo){try{RED.tubo.enviar({t:'adios'});}catch(e){}RED.tubo.cerrar();RED.tubo=null;}RED.empezada=false;RED.caido=false;}
function codigoNuevo(){const L='ABCDEFGHJKLMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=L[Math.floor(Math.random()*L.length)];return s;}
function alRecibir(m){
  if(m.t==='adios'){if(RED.empezada){RED.caido=true;ui();}return;}
  if(m.t==='hola'&&RED.asiento===0){ // llega el rival: empieza la partida
    if(!RED.empezada){RED.empezada=true;salaEl.hidden=true;nuevaPartida('online');}
    RED.tubo.enviar({t:'inicio',piles:ST.piles});return;}
  if(m.t==='inicio'&&RED.asiento===1&&!RED.empezada){RED.empezada=true;clearInterval(RED.llamada);salaEl.hidden=true;nuevaPartida('online',m.piles);return;}
  if(m.t==='acc'&&RED.empezada)accionRemota(m);}
async function crearSala(){
  cerrarRed();RED.asiento=0;RED.cod=codigoNuevo();salaEst.textContent='Conectando…';
  try{await cargarLib();}catch(e){salaEst.textContent='No hay conexión a internet';return;}
  RED.tubo=tubo(RED.cod,alRecibir,()=>{salaEst.innerHTML='Código de tu sala:<b>'+RED.cod+'</b>Díselo a tu rival y espera';});}
async function unirSala(){
  const cod=(document.getElementById('codSala').value||'').toUpperCase().replace(/[^A-Z]/g,'');
  if(cod.length!==4){salaEst.textContent='El código tiene 4 letras';return;}
  cerrarRed();RED.asiento=1;RED.cod=cod;salaEst.textContent='Buscando la sala '+cod+'…';
  try{await cargarLib();}catch(e){salaEst.textContent='No hay conexión a internet';return;}
  RED.tubo=tubo(cod,alRecibir,()=>{let k=0;const llamar=()=>{if(RED.empezada)return;if(++k>8){clearInterval(RED.llamada);salaEst.textContent='No encuentro esa sala. Revisa el código.';return;}RED.tubo.enviar({t:'hola'});};llamar();RED.llamada=setInterval(llamar,3000);});}
const salirEl=document.getElementById('salir'),aMenu=document.getElementById('aMenu');
function enMenu(){return !document.getElementById('menu').hidden||!salaEl.hidden||!document.getElementById('fin').hidden;}
aMenu.addEventListener('click',()=>{if(enMenu())return;salirEl.hidden=false;});
document.getElementById('salirNo').addEventListener('click',()=>{salirEl.hidden=true;});
document.getElementById('salirSi').addEventListener('click',()=>{salirEl.hidden=true;cerrarRed();anims=[];ST.busy=false;ST.phase='fin';glowsOff();document.getElementById('menu').hidden=false;});
setInterval(()=>{aMenu.hidden=enMenu();},300);
document.getElementById('mOnline').addEventListener('click',()=>{document.getElementById('menu').hidden=true;salaEl.hidden=false;salaEst.textContent='';});
document.getElementById('crearSala').addEventListener('click',crearSala);
document.getElementById('unirSala').addEventListener('click',unirSala);
document.getElementById('salaVolver').addEventListener('click',()=>{cerrarRed();salaEl.hidden=true;document.getElementById('menu').hidden=false;});

// ---------- cámara ----------
let camYaw=0,camYawTarget=0,yawOff=0,pitch=.95;let dist=11;
const PUNTOS_VISTA=[[2.85,2.85],[-2.85,2.85],[2.85,-2.85],[-2.85,-2.85],[2.5,3.75],[-2.6,3.75],[-2.5,-3.75],[2.6,-3.75]];
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  dist=10.2*Math.max(1,1.0/camera.aspect);camera.updateProjectionMatrix();}
addEventListener('resize',resize);
function placeCam(){const tgt=new T3.Vector3(0,-.4,0);
  const yaw=camYaw+yawOff;
  // al girar, la cámara se aleja lo justo para que no se salgan del móvil el tablero ni los montones
  const cY=Math.cos(yaw),sY=Math.sin(yaw);let mx=0;
  for(const [x,z] of PUNTOS_VISTA){mx=Math.max(mx,Math.abs(x*cY-z*sY));}
  const d=dist*Math.max(1,mx/3.05);
  camera.position.set(tgt.x+sY*Math.cos(pitch)*d,tgt.y+Math.sin(pitch)*d,tgt.z+cY*Math.cos(pitch)*d);
  if(shake>0&&!reduce){camera.position.x+=(Math.random()-.5)*shake;camera.position.y+=(Math.random()-.5)*shake;}
  camera.lookAt(tgt);
  const cy=Math.cos(camYaw+yawOff),sy=Math.sin(camYaw+yawOff);sun.position.set(-4*cy+5*sy,9,4*sy+5*cy);}

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  anims=anims.filter(a=>{a.t+=dt*(window.__speed||1);const u=Math.min(1,a.t/a.dur);a.fn(u);if(u>=1){a.res();return false;}return true;});
  updParts(dt);
  glowPool.forEach((g,i)=>{if(!g)return;const tgt=g.userData.on?.55+.25*Math.sin(now/300+i):0;g.material.opacity+=(tgt-g.material.opacity)*Math.min(1,dt*10);g.visible=g.material.opacity>.01;});
  if(bob&&ST.phase==='place')bob.position.y=bobY+Math.sin(now/350)*.06;
  shake*=Math.pow(.0005,dt);if(shake<.002)shake=0;
  placeCam();renderer.render(scene,camera);requestAnimationFrame(frame);
}
resize();nuevaPartida('dos');requestAnimationFrame(frame);

//__TEST__
})();
